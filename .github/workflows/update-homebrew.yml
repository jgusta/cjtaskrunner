name: Update Homebrew Formula

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  update-homebrew:
    runs-on: ubuntu-latest

    steps:
      - name: Compute release tarball info
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA256="$(curl -L "$URL" | sha256sum | awk '{print $1}')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: jgusta/homebrew-cjtaskrunner
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cjtaskrunner

      - name: Update formula
        shell: bash
        env:
          TARBALL_URL: ${{ steps.release.outputs.url }}
          TARBALL_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail

          cd homebrew-cjtaskrunner

          ruby -0777 -pi -e '
            formula = $_
            formula.gsub!(/url "https:\/\/github\.com\/jgusta\/cjtaskrunner\/archive\/refs\/tags\/v[^"]+\.tar\.gz"/, "url \"#{ENV.fetch("TARBALL_URL")}\"")
            formula.gsub!(/sha256 "[a-fA-F0-9]{64}"/, "sha256 \"#{ENV.fetch("TARBALL_SHA256")}\"")
            $_ = formula
          ' Formula/cj.rb

      - name: Commit and push formula update
        shell: bash
        run: |
          set -euo pipefail

          cd homebrew-cjtaskrunner

          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/cj.rb
          git commit -m "Update cjtaskrunner to ${GITHUB_REF_NAME}"
          git push

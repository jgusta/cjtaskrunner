name: Update Homebrew Formula

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example, v0.2.1)"
        required: true
        type: string

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Compute release tarball info
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic-version tag such as v0.2.1, got: $TAG" >&2
            exit 1
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA256="$(curl --fail --location "$URL" | sha256sum | awk '{print $1}')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: jgusta/homebrew-cjtaskrunner
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-cjtaskrunner

      - name: Update formula
        shell: bash
        env:
          TARBALL_URL: ${{ steps.release.outputs.url }}
          TARBALL_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail

          cd homebrew-cjtaskrunner

          ruby -0777 -pi -e '
            formula = $_
            url_updates = formula.gsub!(/url "https:\/\/github\.com\/jgusta\/cjtaskrunner\/archive\/refs\/tags\/[^"]+\.tar\.gz"/, "url \"#{ENV.fetch("TARBALL_URL")}\"")
            formula.gsub!(/sha256 "[a-fA-F0-9]{64}"/, "sha256 \"#{ENV.fetch("TARBALL_SHA256")}\"")
            abort "Formula URL was not updated" unless url_updates
            $_ = formula
          ' Formula/cj.rb

      - name: Commit and push formula update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          cd homebrew-cjtaskrunner

          BRANCH="cj-${RELEASE_TAG}"
          git checkout -B "$BRANCH"

          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add Formula/cj.rb
            git commit -m "cj ${RELEASE_TAG#v}"
          fi

          git push --force-with-lease --set-upstream origin "$BRANCH"

          PR_URL="$(gh pr list \
            --repo jgusta/homebrew-cjtaskrunner \
            --head "$BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')"
          if [[ -z "$PR_URL" ]]; then
            PR_URL="$(gh pr create \
              --repo jgusta/homebrew-cjtaskrunner \
              --base main \
              --head "$BRANCH" \
              --title "cj ${RELEASE_TAG#v}" \
              --body "Update cj to ${RELEASE_TAG}. Homebrew bottle artifacts will be built by brew test-bot; publish them with the tap's brew pr-pull workflow after checks pass.")"
          fi

          echo "Homebrew formula pull request: $PR_URL"
